name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout compliance-triangle
        uses: actions/checkout@v4

      - name: Checkout legal-hallucination-bench (KB sibling, best-effort)
        # bench is a PRIVATE repo; the default GITHUB_TOKEN cannot read it, so
        # this checkout fails in CI. It is best-effort: when the sibling is
        # absent, the integration tests skip (they gate on the knowledge_base/
        # subdir) and kb.py falls back to the vendored snapshot under
        # compliance_triangle/vendor/bench_kb, so the suite still runs green.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: vickywu97/legal-hallucination-bench
          path: ../legal-hallucination-bench

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v
