<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .bg { fill: #f1f5f9; }
    .win { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .title { fill: #0f172a; }
    .label { fill: #475569; }
    .sub { fill: #94a3b8; }
    .kpi { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .green { fill: #16a34a; }
    .yellow { fill: #ca8a04; }
    .red { fill: #dc2626; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .chip { fill: #dcfce7; }
    .chiptext { fill: #15803d; }
    .tab { fill: #e2e8f0; }
    .tabact { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1120; }
      .win { fill: #111827; stroke: #374151; }
      .title { fill: #f8fafc; }
      .label { fill: #cbd5e1; }
      .sub { fill: #64748b; }
      .kpi { fill: #1e293b; stroke: #374151; }
      .card { fill: #1e293b; stroke: #374151; }
      .chip { fill: #14532d; }
      .chip { fill: #14532d; }
      .tab { fill: #334155; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="470" rx="18"/>
  <rect class="win" x="20" y="20" width="720" height="430" rx="14"/>

  <!-- header -->
  <circle cx="42" cy="46" r="6" fill="#ef4444"/>
  <circle cx="60" cy="46" r="6" fill="#f59e0b"/>
  <circle cx="78" cy="46" r="6" fill="#22c55e"/>
  <text class="title" x="100" y="51" font-size="15" font-weight="700">合规备忘录 · 引注核验总览</text>
  <text class="sub" x="700" y="51" text-anchor="end" font-size="11">场景 S1 · 员工股权激励</text>

  <!-- KPI cards -->
  <g>
    <rect class="kpi" x="40" y="74" width="210" height="72" rx="10"/>
    <text x="64" y="116" font-size="34" font-weight="700" class="green">🟢 6</text>
    <text class="label" x="150" y="100" font-size="13" font-weight="600">已通过</text>
    <text class="sub" x="150" y="120" font-size="11">条文存在且在效期内</text>
  </g>
  <g>
    <rect class="kpi" x="275" y="74" width="210" height="72" rx="10"/>
    <text x="299" y="116" font-size="34" font-weight="700" class="yellow">🟡 4</text>
    <text class="label" x="385" y="100" font-size="13" font-weight="600">待复核</text>
    <text class="sub" x="385" y="120" font-size="11">引述与官方有差异</text>
  </g>
  <g>
    <rect class="kpi" x="510" y="74" width="210" height="72" rx="10"/>
    <text x="534" y="116" font-size="34" font-weight="700" class="red">🔴 7</text>
    <text class="label" x="620" y="100" font-size="13" font-weight="600">未通过</text>
    <text class="sub" x="620" y="120" font-size="11">虚构 / 废止 / 张冠李戴</text>
  </g>

  <!-- distribution bar -->
  <text class="label" x="40" y="172" font-size="12" font-weight="600">核验分布（共 17 条引注）</text>
  <rect class="green" x="40" y="182" width="240" height="20" rx="4"/>
  <rect class="yellow" x="280" y="182" width="160" height="20"/>
  <rect class="red" x="440" y="182" width="280" height="20" rx="4"/>
  <text x="40" y="218" font-size="10.5" class="sub">🟢 35%</text>
  <text x="350" y="218" font-size="10.5" class="sub">🟡 24%</text>
  <text x="640" y="218" font-size="10.5" class="sub">🔴 41%</text>

  <!-- scenario tabs -->
  <rect class="tabact" x="40" y="232" width="120" height="26" rx="6"/>
  <text x="100" y="249" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="600">S1 股权激励</text>
  <rect class="tab" x="168" y="232" width="100" height="26" rx="6"/>
  <text x="218" y="249" text-anchor="middle" font-size="11.5" class="label">S2 专利</text>
  <rect class="tab" x="276" y="232" width="110" height="26" rx="6"/>
  <text x="331" y="249" text-anchor="middle" font-size="11.5" class="label">S3 跨境许可</text>
  <rect class="tab" x="394" y="232" width="110" height="26" rx="6"/>
  <text x="449" y="249" text-anchor="middle" font-size="11.5" class="label">S4 研发加计</text>
  <rect class="tab" x="512" y="232" width="120" height="26" rx="6"/>
  <text x="572" y="249" text-anchor="middle" font-size="11.5" class="label">S5 对外担保</text>

  <!-- sample citation card -->
  <rect class="card" x="40" y="270" width="680" height="162" rx="12"/>
  <text class="title" x="60" y="298" font-size="13.5" font-weight="700">《公司法》第 142 条 · 股份回购限制</text>
  <rect class="chip" x="588" y="282" width="118" height="24" rx="12"/>
  <text class="chiptext" x="647" y="299" text-anchor="middle" font-size="12" font-weight="700">🟢 已核验通过</text>

  <text class="label" x="60" y="326" font-size="11.5" font-weight="600">AI 引述</text>
  <text class="label" x="60" y="346" font-size="11.5">“公司因股权激励回购股份的，不得超过已发行股份总额的 10%……”</text>
  <text class="sub" x="60" y="366" font-size="10.5">→ 与官方原文逐字一致，存在性 / 时效性 / 内容匹配 三层均通过。</text>

  <line x1="60" y1="382" x2="700" y2="382" stroke="#e2e8f0" stroke-width="1"/>
  <text class="label" x="60" y="404" font-size="11.5" font-weight="600">官方原文（ground truth）</text>
  <text class="label" x="60" y="424" font-size="11.5">“公司因将股份用于员工持股计划或者股权激励……不得超已发行股份总额百分之十……”</text>
</svg>
